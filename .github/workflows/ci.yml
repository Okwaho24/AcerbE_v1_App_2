name: AcerbE Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-engine:
    name: Build & Validate AcerbE Forensic Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Native QPDF System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libqpdf-dev qpdf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pikepdf pypdf

      - name: Run Python Unit Test Suite (Native pikepdf)
        env:
          ACERBE_SECRET_KEY: ${{ secrets.ACERBE_SECRET_KEY || 'ci_ephemeral_hmac_secret_key_32bytes_min' }}
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run Node.js RaPaX Integration Tests
        env:
          ACERBE_SECRET_KEY: ${{ secrets.ACERBE_SECRET_KEY || 'ci_ephemeral_hmac_secret_key_32bytes_min' }}
        run: |
          node tests/test_rapax_integration.js

      - name: Upload Test Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-test-outputs
          path: tests/output/
          retention-days: 7
